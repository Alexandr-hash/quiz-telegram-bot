name: Python CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    # 1. Проверяем что код компилируется
    - name: Check syntax
      run: |
        echo "🔍 Проверяем синтаксис..."
        python -m py_compile src/bot.py
        echo "✅ Синтаксис Python правильный"
    
    # 2. Проверяем что шаблоны - валидныgit add .е файлы
    - name: Validate templates
      run: |
        echo "🔍 Проверяем шаблоны..."
        python -c "import json; json.load(open('templates/config.json.example'))"
        echo "✅ config.json.example - валидный JSON"
        
        python -c "import csv; f = open('templates/questions.csv.example', encoding='utf-8'); list(csv.reader(f))"
        echo "✅ questions.csv.example - валидный CSV"
    
    # 3. Проверяем структуру проекта
    - name: Check project structure
      run: |
        echo "🔍 Проверяем структуру..."
        [ -f "src/bot.py" ] || exit 1
        [ -f ".gitignore" ] || exit 1
        [ -f "README.md" ] || exit 1
        echo "✅ Все необходимые файлы на месте"
    
    # 4. Проверяем что важные импорты есть
    - name: Check critical imports
      run: |
        echo "🔍 Проверяем импорты..."
        python -c "
import sys
try:
    import asyncio
    import csv
    import json
    import pathlib
    print('✅ Все системные импорты работают')
except ImportError as e:
    print(f'❌ Ошибка: {e}')
    sys.exit(1)
        "
    
    - name: Success
      run: echo "🎉 Все проверки пройдены! Код готов к работе."